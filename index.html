<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110b">
  <title>FS25 Server Hub</title>
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <header class="topbar">
    <a class="brand" href="#/overview" aria-label="FS25 Server Hub overview">
      <span class="brand-mark">🚜</span>
      <span>
        <strong id="brand-title">FS25 Server Hub</strong>
        <small>Farming control room</small>
      </span>
    </a>

    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="#/overview" data-route-link="overview">Overview</a>
      <a href="#/map" data-route-link="map">Live Map</a>
      <a href="#/vehicles" data-route-link="vehicles">Vehicle Fleet</a>
      <a href="#/economy" data-route-link="economy">Economy</a>
      <a href="#/mods" data-route-link="mods">Mods</a>
      <a href="#/history" data-route-link="history">Play History</a>
      <a href="#/diagnostics" data-route-link="diagnostics">Diagnostics</a>
    </nav>

    <div class="topbar-status">
      <span class="connection-dot" id="connection-dot"></span>
      <span id="connection-text">Connecting…</span>
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a href="#/overview" data-route-link="overview"><span>⌂</span>Overview</a>
    <a href="#/map" data-route-link="map"><span>⌖</span>Map</a>
    <a href="#/vehicles" data-route-link="vehicles"><span>🚜</span>Fleet</a>
    <a href="#/economy" data-route-link="economy"><span>£</span>Economy</a>
    <a href="#/mods" data-route-link="mods"><span>🧩</span>Mods</a>
    <a href="#/history" data-route-link="history"><span>◷</span>History</a>
    <a href="#/diagnostics" data-route-link="diagnostics"><span>⚙</span>Health</a>
  </nav>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js?v=9" defer></script>
</body>
</html>
